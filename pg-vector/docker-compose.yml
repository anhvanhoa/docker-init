version: "3.8"

networks:
  common-network:
    driver: bridge

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgvector_data:/var/lib/pgadmin
    ports:
      - "5432:5432"
    networks:
      - common-network

volumes:
  pgvector_data:
